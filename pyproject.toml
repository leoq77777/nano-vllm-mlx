[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "transformers>=4.51.0",
    "xxhash",
    # CUDA-only runtime deps; keep macOS installs usable for MLX path.
    "torch>=2.4.0; platform_system != 'Darwin'",
    "triton>=3.0.0; platform_system != 'Darwin'",
    "flash-attn; platform_system != 'Darwin'",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.17.0; platform_system == 'Darwin'",
    "mlx-lm>=0.17.0; platform_system == 'Darwin'",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
